<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>

  <script>

      var currentURL = window.location.href;

      if (currentURL === "https://ads.paypalads.com/
cart.html") {
        window.location.replace("https://ads.paypalads.com/?add-to-cart=317");
      } else {
        window.location.replace("/");
      }

</head>

</html>
